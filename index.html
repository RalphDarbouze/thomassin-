<script>
    (function() {
        "use strict";

        // ============================================
        // VIEWER COUNTER - REAL REST API INTEGRATION
        // ============================================
        
        // Configuration - Change this to your server URL
        const API_BASE_URL = 'http://localhost:3000/api';
        
        // Generate a unique session ID for this viewer
        function generateSessionId() {
            return 'viewer_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        // Get or create session ID (persist in localStorage)
        let sessionId = localStorage.getItem('rubisTvSessionId');
        if (!sessionId) {
            sessionId = generateSessionId();
            localStorage.setItem('rubisTvSessionId', sessionId);
        }
        
        let heartbeatInterval = null;
        let isViewerConnected = false;
        
        // Send heartbeat to server
        async function sendHeartbeat() {
            try {
                const response = await fetch(`${API_BASE_URL}/viewer/heartbeat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        sessionId,
                        userAgent: navigator.userAgent,
                        timestamp: Date.now()
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    isViewerConnected = true;
                    // Update viewer count in UI
                    const viewerCountEl = document.getElementById('viewerCount');
                    if (viewerCountEl && typeof data.viewers === 'number') {
                        viewerCountEl.textContent = data.viewers;
                    }
                }
            } catch (error) {
                console.error('Heartbeat failed:', error);
                isViewerConnected = false;
                // If server is down, show "?" to indicate connection issue
                const viewerCountEl = document.getElementById('viewerCount');
                if (viewerCountEl) {
                    viewerCountEl.textContent = '?';
                }
            }
        }
        
        // Send leave notification when user leaves
        async function sendLeaveNotification() {
            try {
                await fetch(`${API_BASE_URL}/viewer/leave`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ sessionId })
                });
            } catch (e) {
                // Ignore errors on page unload
            }
        }
        
        // Initialize real viewer counter
        function initViewerCounter() {
            // Send initial heartbeat
            sendHeartbeat();
            
            // Send heartbeat every 10 seconds
            heartbeatInterval = setInterval(sendHeartbeat, 10000);
            
            // Send leave notification when user leaves the page
            window.addEventListener('beforeunload', sendLeaveNotification);
            window.addEventListener('pagehide', sendLeaveNotification);
            
            // Also send leave when tab is hidden (optional)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    // Tab is hidden, we could reduce heartbeat frequency
                    // Or send a "away" status if you implement it
                }
            });
        }
        
        // Check server status on startup
        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/status`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    console.log('✅ Viewer server is online');
                    return true;
                }
            } catch (e) {
                console.warn('⚠️ Viewer server is offline - using fallback mode');
                // Fallback: show a simulated count with a "demo" indicator
                const viewerCountEl = document.getElementById('viewerCount');
                if (viewerCountEl) {
                    viewerCountEl.textContent = '0';
                }
                return false;
            }
            return false;
        }
        
        // ============================================
        // END VIEWER COUNTER INTEGRATION
        // ============================================

        const state = {
            channels: [],
            filtered: [],
            currentIndex: 0,
            isPlaying: false,
            volume: 0.75,
            targetBuffer: 15,
            isFullscreen: false,
            overlayTimer: null,
            bufferingActive: false,
            bufferInterval: null,
            bufferReady: false,
        };

        const video = document.getElementById('video-player');
        const channelList = document.getElementById('channelList');
        const searchInput = document.getElementById('channelSearch');
        const channelCount = document.getElementById('channelCount');
        const overlayName = document.getElementById('overlayName');
        const overlayGroup = document.getElementById('overlayGroup');
        const npName = document.getElementById('npName');
        const npGroup = document.getElementById('npGroup');
        const npLogo = document.getElementById('npLogo');
        const streamStatus = document.getElementById('streamStatus');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const manualBufferBtn = document.getElementById('manualBufferBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volIcon = document.getElementById('volIcon');
        const fsBtn = document.getElementById('fsBtn');
        const playerOverlay = document.getElementById('playerOverlay');
        const bufferOverlay = document.getElementById('bufferOverlay');
        const bufferFill = document.getElementById('bufferFill');
        const bufferTimer = document.getElementById('bufferTimer');
        const bufferText = document.getElementById('bufferText');
        const channelFeedback = document.getElementById('channelFeedback');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');
        const durationDisplay = document.getElementById('durationDisplay');
        const clock = document.getElementById('clock');
        const viewerCount = document.getElementById('viewerCount');
        const statBufferTime = document.getElementById('statBufferTime');
        const statBufferProgress = document.getElementById('statBufferProgress');
        const statNetworkSpeed = document.getElementById('statNetworkSpeed');
        const currentBufferDisplay = document.getElementById('currentBufferDisplay');
        const targetBufferDisplay = document.getElementById('targetBufferDisplay');
        const perfNetwork = document.getElementById('perfNetwork');
        const networkSpeedEl = document.getElementById('networkSpeed');

        const PLAYLIST_URL = 'https://gist.githubusercontent.com/RalphDarbouze/7fc242ebfecbba4f6854becb8b8abc94/raw/d67e6d3878b8c0f74ba20a2a4cf001a0157c15bb/gistfile1.txt';

        function formatTime(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        function getInitials(name) {
            return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
        }

        function stringToColor(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
            return `hsl(${h % 360}, 70%, 45%)`;
        }

        function updateClock() {
            const d = new Date();
            clock.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        updateClock();
        setInterval(updateClock, 30000);

        async function loadPlaylist() {
            try {
                const resp = await fetch(PLAYLIST_URL);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const txt = await resp.text();
                parseM3U(txt);
            } catch (e) {
                console.warn('Playlist fallback', e);
                loadDemo();
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let current = null;
            let num = 1;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const match = line.match(/#EXTINF:.*?(?:group-title="([^"]+)")?.*?,(.*)/);
                    if (match) {
                        const group = match[1] || 'Général';
                        const name = match[2]?.trim() || 'Chaîne';
                        current = { name, group, url: null, number: num++ };
                    }
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    channels.push(current);
                    current = null;
                }
            }
            if (channels.length) {
                state.channels = channels;
                state.filtered = [...channels];
                renderChannels();
                if (state.filtered.length) selectChannel(0);
            } else {
                loadDemo();
            }
        }

        function loadDemo() {
            const demo = [
                { name: 'BBC World News', group: 'News', url: 'https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4', number: 1 },
                { name: 'CNN International', group: 'News', url: 'https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_2mb.mp4', number: 2 },
                { name: 'ESPN HD', group: 'Sports', url: 'https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_5mb.mp4', number: 3 },
                { name: 'HBO HD', group: 'Entertainment', url: 'https://sample-videos.com/video123/mp4/480/big_buck_bunny_480p_1mb.mp4', number: 4 },
            ];
            state.channels = demo;
            state.filtered = [...demo];
            renderChannels();
            if (state.filtered.length) selectChannel(0);
        }

        function renderChannels() {
            channelList.innerHTML = '';
            state.filtered.forEach((ch, idx) => {
                const div = document.createElement('div');
                div.className = `channel-item ${idx === state.currentIndex ? 'active' : ''}`;
                div.dataset.index = idx;
                const color = stringToColor(ch.name);
                div.innerHTML = `
                    <div class="channel-logo" style="background:${color}">${getInitials(ch.name)}</div>
                    <div class="channel-info">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-number">${ch.number}</div>
                    </div>
                    <div class="channel-playing">${idx === state.currentIndex ? '<i class="fas fa-play"></i>' : ''}</div>
                `;
                div.addEventListener('click', () => { selectChannel(idx); showOverlay(); });
                channelList.appendChild(div);
            });
            channelCount.textContent = state.filtered.length;
        }

        function selectChannel(index) {
            if (index < 0 || index >= state.filtered.length) return;
            state.currentIndex = index;
            const ch = state.filtered[index];
            if (!ch || !ch.url) return;

            document.querySelectorAll('.channel-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
                const playing = el.querySelector('.channel-playing');
                if (playing) playing.innerHTML = i === index ? '<i class="fas fa-play"></i>' : '';
            });

            overlayName.textContent = ch.name;
            overlayGroup.textContent = ch.group;
            npName.textContent = ch.name;
            npGroup.textContent = ch.group;
            npLogo.textContent = getInitials(ch.name);
            npLogo.style.background = stringToColor(ch.name);
            streamStatus.textContent = 'Buffering...';
            streamStatus.style.color = '#f0b040';

            channelFeedback.classList.remove('show');

            video.pause();
            state.isPlaying = false;
            playIcon.className = 'fas fa-play';

            startBuffer(ch.url);
        }

        function startBuffer(url) {
            if (state.bufferInterval) {
                clearInterval(state.bufferInterval);
                state.bufferInterval = null;
            }
            state.bufferingActive = true;
            state.bufferReady = false;

            bufferOverlay.classList.add('active');
            bufferFill.style.width = '0%';
            bufferTimer.textContent = '0 / 15s';
            bufferText.textContent = 'Pré-buffering 15s';

            let target = state.targetBuffer || 15;
            let elapsed = 0;

            video.src = url;
            video.crossOrigin = 'anonymous';
            video.preload = 'auto';
            video.load();

            let canPlayHandler = () => {
                if (state.bufferingActive) {
                    const buf = video.buffered;
                    if (buf.length > 0) {
                        const end = buf.end(buf.length - 1);
                        if (end > video.currentTime + 1.5) {
                            finishBuffer();
                        }
                    }
                }
            };
            video.addEventListener('canplay', canPlayHandler);
            video.addEventListener('loadeddata', canPlayHandler);

            state.bufferInterval = setInterval(() => {
                if (!state.bufferingActive) return;

                if (video.buffered.length > 0) {
                    const end = video.buffered.end(video.buffered.length - 1);
                    const currentTime = video.currentTime || 0;
                    const bufferSec = Math.max(0, end - currentTime);
                    const progress = Math.min(bufferSec / target, 1);
                    const pct = Math.round(progress * 100);
                    bufferFill.style.width = pct + '%';
                    bufferTimer.textContent = `${Math.min(bufferSec, target).toFixed(1)} / ${target}s`;
                    statBufferTime.textContent = bufferSec.toFixed(1) + 's';
                    statBufferProgress.textContent = pct + '%';
                    currentBufferDisplay.textContent = bufferSec.toFixed(1) + 's';

                    if (bufferSec >= target || (video.videoWidth > 0 && bufferSec > 1.5)) {
                        finishBuffer();
                    }
                } else {
                    elapsed += 0.5;
                    const prog = Math.min(elapsed / target, 1);
                    bufferFill.style.width = (prog * 100) + '%';
                    bufferTimer.textContent = `${Math.min(elapsed, target).toFixed(1)} / ${target}s`;
                    if (elapsed >= target) finishBuffer();
                }
            }, 300);

            function finishBuffer() {
                if (!state.bufferingActive) return;
                state.bufferingActive = false;
                state.bufferReady = true;
                if (state.bufferInterval) {
                    clearInterval(state.bufferInterval);
                    state.bufferInterval = null;
                }
                video.removeEventListener('canplay', canPlayHandler);
                video.removeEventListener('loadeddata', canPlayHandler);
                bufferOverlay.classList.remove('active');

                video.play().then(() => {
                    state.isPlaying = true;
                    playIcon.className = 'fas fa-pause';
                    streamStatus.textContent = 'En direct';
                    streamStatus.style.color = '#6effc0';
                }).catch(() => {
                    state.isPlaying = false;
                    playIcon.className = 'fas fa-play';
                    streamStatus.textContent = 'Prêt';
                    streamStatus.style.color = '#6effc0';
                });
            }
        }

        function showOverlay() {
            playerOverlay.classList.add('active');
            clearTimeout(state.overlayTimer);
            state.overlayTimer = setTimeout(() => {
                playerOverlay.classList.remove('active');
            }, 4000);
        }

        function navChannel(delta) {
            let idx = state.currentIndex + delta;
            if (idx < 0) idx = state.filtered.length - 1;
            if (idx >= state.filtered.length) idx = 0;
            selectChannel(idx);
            showOverlay();
        }

        function togglePlay() {
            if (!video.src) return;
            if (video.paused) {
                video.play().then(() => {
                    state.isPlaying = true;
                    playIcon.className = 'fas fa-pause';
                    streamStatus.textContent = 'En direct';
                }).catch(() => {});
            } else {
                video.pause();
                state.isPlaying = false;
                playIcon.className = 'fas fa-play';
                streamStatus.textContent = 'Pause';
            }
            showOverlay();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        }

        function manualBuffer() {
            if (state.filtered.length && state.filtered[state.currentIndex]) {
                selectChannel(state.currentIndex);
                showOverlay();
            }
        }

        function updateVolumeIcon() {
            const v = video.volume;
            if (v === 0) volIcon.className = 'fas fa-volume-off';
            else if (v < 0.5) volIcon.className = 'fas fa-volume-down';
            else volIcon.className = 'fas fa-volume-up';
        }

        let digitBuffer = '';
        let digitTimer = null;
        function handleDigit(digit) {
            clearTimeout(digitTimer);
            digitBuffer += digit;
            channelFeedback.textContent = digitBuffer;
            channelFeedback.classList.add('show');
            digitTimer = setTimeout(() => {
                const num = parseInt(digitBuffer);
                const idx = state.filtered.findIndex(c => c.number === num);
                if (idx !== -1) { selectChannel(idx); showOverlay(); }
                digitBuffer = '';
                channelFeedback.classList.remove('show');
            }, 1800);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
            if (e.key === 'b' || e.key === 'B') { e.preventDefault(); manualBuffer(); }
            if (e.key === ' ') { e.preventDefault(); togglePlay(); }
            if (e.key === 'ArrowUp') { e.preventDefault(); navChannel(-1); }
            if (e.key === 'ArrowDown') { e.preventDefault(); navChannel(1); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); video.volume = Math.max(0, video.volume - 0.05); volumeSlider.value = video.volume; updateVolumeIcon(); }
            if (e.key === 'ArrowRight') { e.preventDefault(); video.volume = Math.min(1, video.volume + 0.05); volumeSlider.value = video.volume; updateVolumeIcon(); }
            if (e.key === 'Escape') {
                channelFeedback.classList.remove('show');
                digitBuffer = '';
                clearTimeout(digitTimer);
            }
            if (e.key >= '1' && e.key <= '9') { e.preventDefault(); handleDigit(e.key); }
            if (e.key === '0') {
                e.preventDefault();
                if (digitBuffer.length === 0) {
                    toggleFullscreen();
                } else {
                    handleDigit('0');
                }
            }
            if (e.key >= '1' && e.key <= '4') {
                const map = {1:5,2:10,3:15,4:20};
                const sec = map[e.key];
                if (sec) {
                    state.targetBuffer = sec;
                    targetBufferDisplay.textContent = sec + 's';
                    document.querySelectorAll('#bufferPreset button').forEach(b => {
                        b.classList.toggle('active', parseInt(b.dataset.buffer) === sec);
                    });
                }
            }
        });

        // ============================================
        // TV REMOTE CHANNEL +/- SUPPORT (robust)
        // Handles all common TV remote key variants.
        // ============================================
        document.addEventListener('keydown', (e) => {
            // --- DEBUG: log every key so you can see what your remote sends ---
            // (open DevTools console, press CH+ / CH- on your remote)
            console.log('KEY:', e.key, '| code:', e.code, '| keyCode:', e.keyCode);

            const key = e.key;
            const code = e.code;
            const kc = e.keyCode;

            // Channel UP (next)
            const isChannelUp =
                key === 'ChannelUp' ||
                key === 'MediaChannelUp' ||
                key === 'PageUp' ||
                code === 'ChannelUp' ||
                code === 'MediaChannelUp' ||
                code === 'PageUp' ||
                kc === 33 ||          // PageUp legacy
                kc === 427 ||         // some Android TV remotes
                key === '+' ||
                key === 'Add';

            // Channel DOWN (previous)
            const isChannelDown =
                key === 'ChannelDown' ||
                key === 'MediaChannelDown' ||
                key === 'PageDown' ||
                code === 'ChannelDown' ||
                code === 'MediaChannelDown' ||
                code === 'PageDown' ||
                kc === 34 ||          // PageDown legacy
                kc === 428 ||         // some Android TV remotes
                key === '-' ||
                key === 'Subtract';

            if (isChannelUp) {
                e.preventDefault();
                navChannel(1);          // next channel
                showOverlay();
                return;
            }
            if (isChannelDown) {
                e.preventDefault();
                navChannel(-1);         // previous channel
                showOverlay();
                return;
            }
        });

        // ============================================
        // END TV REMOTE CHANNEL +/- SUPPORT
        // ============================================

        function init() {
            // Check server status and initialize viewer counter
            checkServerStatus().then(() => {
                initViewerCounter();
            });

            loadPlaylist();

            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', () => { navChannel(-1); showOverlay(); });
            nextBtn.addEventListener('click', () => { navChannel(1); showOverlay(); });
            manualBufferBtn.addEventListener('click', manualBuffer);
            fsBtn.addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', () => {
                document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
            });

            volumeSlider.addEventListener('input', () => {
                video.volume = parseFloat(volumeSlider.value);
                updateVolumeIcon();
            });
            video.addEventListener('volumechange', updateVolumeIcon);

            searchInput.addEventListener('input', () => {
                const q = searchInput.value.toLowerCase();
                state.filtered = state.channels.filter(c =>
                    c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q)
                );
                renderChannels();
                if (state.filtered.length) selectChannel(0);
            });

            video.addEventListener('timeupdate', () => {
                currentTimeDisplay.textContent = formatTime(video.currentTime);
                if (video.duration) durationDisplay.textContent = formatTime(video.duration);
                if (video.buffered.length) {
                    const end = video.buffered.end(video.buffered.length - 1);
                    const buf = end - video.currentTime;
                    if (buf > 0) {
                        const pct = Math.min((buf / state.targetBuffer) * 100, 100);
                        statBufferProgress.textContent = Math.round(pct) + '%';
                        statBufferTime.textContent = buf.toFixed(1) + 's';
                        currentBufferDisplay.textContent = buf.toFixed(1) + 's';
                    }
                }
            });

            setInterval(() => {
                const speed = (3 + Math.random() * 12).toFixed(1);
                networkSpeedEl.textContent = speed + ' Mbps';
                statNetworkSpeed.textContent = speed + ' Mbps';
                perfNetwork.textContent = speed + ' Mbps';
            }, 3000);

            document.querySelectorAll('#bufferPreset button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sec = parseInt(btn.dataset.buffer);
                    state.targetBuffer = sec;
                    targetBufferDisplay.textContent = sec + 's';
                    document.querySelectorAll('#bufferPreset button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });

            document.addEventListener('mousemove', showOverlay);
            document.addEventListener('touchstart', showOverlay);

            setTimeout(showOverlay, 500);
            updateVolumeIcon();
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
</script>
